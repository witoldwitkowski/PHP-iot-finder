# iotscan advisory database.
#
# Version facts live here so they can be corrected or extended without touching
# Rust code. A user file (~/.config/iotscan/advisories.toml, or --advisories FILE)
# is merged on top: entries with the same `id` replace the built-in ones.
#
# Verify against the primary sources (php.net/security, your distribution's
# security tracker) before acting; banners alone cannot see back-ported fixes.

schema = 1
updated = "2026-10-24"

