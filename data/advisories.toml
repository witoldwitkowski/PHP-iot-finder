# Branches without an official fixed release.
[advisory.legacy]
below = "8.2"
unconfirmed_below = "7.4"
note = "PHP 8.1, 8.0 and 7.4 are end-of-life: there is no official fixed release, only minimal source back-ports and vendor-patched packages."

