# ---------------------------------------------------------------------------
# PHP2Shell, October 2026
# ---------------------------------------------------------------------------

[[advisory]]
id = "php2shell"
product = "php"
checker = "php2shell"
title = "PHP2Shell: unauthenticated remote code execution in PHP"
severity = "critical"
cves = ["CVE-2026-109618", "CVE-2026-109619"]
published = "2026-10-21"
summary = """Two heap use-after-free flaws in PHP core (an out-of-memory error path that leaves request data partly initialised, and stale request state that is reused after it was freed) let an unauthenticated remote attacker run code with the web worker's privileges. Exploitation in the wild and a public proof of concept have been reported."""
remediation = """Upgrade PHP to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 (or newer), then restart PHP-FPM / Apache / the device's web service. On Debian, Ubuntu and RHEL-family systems install the vendor's security update instead (check the package changelog for CVE-2026-109618 and CVE-2026-109619). If the device is an appliance, look for a firmware update from its maker, and until then block access to its web interface from untrusted networks."""
references = [
  "https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching",
  "https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/",
  "https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities",
  "https://aws.amazon.com/security/security-bulletins/2026-143-aws/",
  "https://securitylabs.datadoghq.com/articles/php2shell-critical-vulnerabilities-in-php/",
  "https://snyk.io/blog/php-patches-critical-unauthenticated-rces/",
  "https://support.plesk.com/hc/en-us/articles/44397729587351-Vulnerability-CVE-2026-109618-and-CVE-2026-109619-PHP2Shell-Remote-code-execution-in-PHP-shipped-with-Plesk",
]

